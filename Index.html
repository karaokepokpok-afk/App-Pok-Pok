<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karaoke</title>
<style>
:root{--bg:#12101a;--card:#1d1a2b;--tx:#eee;--mut:#9a95b0;--pk:#2dd4bf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px}h1{font-size:28px;text-align:center;margin:40px 0 20px}h1 span{color:var(--pk)}
input,select,button,textarea{font:inherit;width:100%;padding:14px;border-radius:12px;border:1px solid #3a3552;background:#0f0d17;color:var(--tx);margin-bottom:10px}
button{background:var(--pk);color:#04201d;border:0;font-weight:700;cursor:pointer}button.sec{background:#3a3552;color:var(--tx)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chips button{width:auto;padding:10px 16px}
header{display:flex;justify-content:space-between;color:var(--mut);padding:8px 0}
nav{display:flex;gap:8px}nav{gap:6px}nav button{background:#2c2840;color:var(--tx);padding:10px 2px;font-size:14px;margin:0}nav button.on{background:var(--pk);color:#04201d}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}.grid button{margin:0;padding:12px 0}.banner{background:#fbbf24;color:#1a1200;padding:12px;border-radius:12px;font-weight:700;margin-bottom:10px;cursor:pointer}
.song{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.song div{flex:1;min-width:0}.song b{display:block}.song small,.mut{color:var(--mut)}.song button{width:auto;margin:0;padding:10px 16px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#12101a;background:var(--c)}
.row{display:flex;gap:8px}.err{color:#f87171;text-align:center}
</style></head><body><div id="app"></div>
<script>
// ===== Dados (demo: localStorage partilhado com a app do operador) =====
const K='karaokeDemo',$=s=>document.querySelector(s),app=$('#app');
const load=()=>Object.assign({session:null,songs:[],requests:[],clients:{},messages:[],people:{},paused:false,info:{},evals:{}},JSON.parse(localStorage[K]||'{}'));
let S=load();const commit=fn=>{S=load();fn();localStorage[K]=JSON.stringify(S)};
const norm=t=>String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={queued:['Na fila','#a78bfa'],preparing:['Em preparação','#fbbf24'],singing:['A cantar','#38bdf8'],done:['Cantado','#4ade80'],cancelled:['Cancelado','#9a95b0']};
let joined=sessionStorage.joined==='1',me=JSON.parse(sessionStorage.me||'null');

// ===== Ecrã 1: PIN =====
function screenPin(msg=''){app.innerHTML=`<h1>🎤 Karaoke <span>Pedidos</span></h1><input id="pin" placeholder="PIN da sessão" inputmode="numeric"><button id="go">Entrar</button><p class="err">${msg}</p>`;
 $('#go').onclick=()=>{S=load();const s=S.session,p=$('#pin').value.trim();
  if(!s||s.pin!==p)return screenPin('PIN inválido.');
  if(!s.open)return screenPin('Esta sessão está encerrada.');
  joined=true;sessionStorage.joined='1';screenId()}}

// ===== Ecrã 2: identificação (telefone + nickname) =====
function screenId(phone='',msg=''){
 const nicks=S.clients[phone]||[];
 app.innerHTML=`<h1>Quem és tu?</h1><div class="row"><input id="ph" placeholder="Número de telefone" inputmode="tel" value="${esc(phone)}"><button class="sec" id="chk" style="width:auto">OK</button></div>
 ${phone?`<p class="mut">${nicks.length?'Escolhe um nickname ou cria um novo:':'Número novo. Cria o teu nickname:'}</p><div class="chips">${nicks.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
 <input id="nn" maxlength="20" placeholder="Novo nickname"><button id="new">Criar e entrar</button>`:''}<p class="err">${msg}</p>`;
 $('#chk').onclick=()=>{const p=$('#ph').value.replace(/\s/g,'');p.length<9?screenId('','Número inválido.'):screenId(p)};
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>enter(phone,b.dataset.n));
 if(phone)$('#new').onclick=()=>{const n=$('#nn').value.trim();if(!n)return screenId(phone,'Escreve um nickname.');
  if(nicks.some(x=>norm(x)===norm(n)))return screenId(phone,'Esse nickname já existe neste número.');
  commit(()=>{(S.clients[phone]??=[]).push(n)});enter(phone,n)}}
function enter(phone,nick){me={phone,nick};sessionStorage.me=JSON.stringify(me);screenMain()}

// ===== Ecrã 3: menu principal =====
const yt=(a,t)=>'https://www.youtube.com/results?search_query='+encodeURIComponent(a+' '+t); // abre a pesquisa no YouTube
const hm=t=>new Date(t).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
const who=()=>me.phone+'|'+me.nick;
const myMsgs=()=>S.messages.filter(m=>m.to==='all'||m.to===who()||m.from===who());
const nextNow=()=>S.requests.some(r=>r.who===who()&&r.next&&['queued','preparing'].includes(r.status));
let wasNext=false,seenMsgs=0;
function notify(t){const b=$('#ban');if(b){b.textContent=t+' (toca para fechar)';b.hidden=false;b.onclick=()=>b.hidden=true}
 try{navigator.vibrate?.([200,100,200])}catch{}
 try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.25)}catch{}}
function screenMain(){
 commit(()=>{S.people[who()]=me.nick});
 app.innerHTML=`<div id="ban" class="banner" hidden></div><header><span>${esc(S.session?.name||'')}</span><span>🎤 ${esc(me.nick)}</span></header>
 <nav><button data-t="a" class="on">Pedir</button><button data-t="b">Pedidos</button><button data-t="c">Mensagens</button><button data-t="d">Opções</button></nav><br>
 <section id="a"><input id="q" placeholder="Referência, título ou artista"><div class="row"><select id="fl"></select><select id="fg"></select></div><p class="mut" id="cnt"></p><div id="res"></div></section>
 <section id="b" hidden></section>
 <section id="c" hidden><div class="row"><input id="mt" placeholder="Mensagem para o operador"><button id="ms" style="width:auto">Enviar</button></div><div id="msgs"></div></section>
 <section id="d" hidden><div id="di"></div><h3 style="margin:24px 0 10px">⭐ Avaliar o karaoke</h3><div id="e"></div></section>`;
 const tabs=['a','b','c','d'];
 app.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{app.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));tabs.forEach(x=>$('#'+x).hidden=x!==b.dataset.t)});
 const fill=(id,k,t)=>{const el=$(id),v=el.value;el.innerHTML=`<option value="">${t}</option>`+[...new Set(S.songs.map(s=>s[k]))].sort().map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')};
 fill('#fl','lang','Língua');fill('#fg','genre','Género');
 ['#q','#fl','#fg'].forEach(i=>$(i).addEventListener('input',renderRes));
 $('#ms').onclick=()=>{const x=$('#mt').value.trim();if(!x)return;commit(()=>S.messages.push({id:Date.now(),ts:Date.now(),from:who(),to:'op',text:x}));$('#mt').value='';renderMsgs()};
 wasNext=nextNow();seenMsgs=myMsgs().filter(m=>m.from==='op').length;
 renderRes();renderMine();renderMsgs();renderOpts();renderEval();if(wasNext)notify('🔔 É a seguir! Prepara-te para cantar.')}
function renderRes(){
 const t=norm($('#q').value).split(/\s+/).filter(Boolean),L=$('#fl').value,G=$('#fg').value;
 const r=S.songs.filter(s=>(!L||s.lang===L)&&(!G||s.genre===G)&&t.every(w=>(s._k??=norm(s.ref+' '+s.title+' '+s.artist)).includes(w)));
 $('#cnt').textContent=S.songs.length?r.length+' músicas':'A biblioteca ainda está vazia.';
 $('#res').innerHTML=r.slice(0,50).map(s=>`<div class="song"><div><b>${esc(s.title)}</b>${esc(s.artist)}<br><small>#${esc(s.ref)} · ${esc(s.lang)} · ${esc(s.genre)}· <a href="${yt(s.artist,s.title)}" target="_blank" rel="noopener" style="color:var(--pk)">▶ YouTube</a></small></div><button data-r="${esc(s.ref)}">Pedir</button></div>`).join('');
 $('#res').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>pedir(b.dataset.r))}
function pedir(ref){
 S=load();
 if(!S.session?.open)return alert('A sessão está encerrada.');
 if(S.paused)return alert('Os pedidos estão em pausa.');
 if(S.requests.some(r=>r.who===who()&&r.ref===ref&&['queued','preparing','singing'].includes(r.status)))return alert('Já pediste esta música.');
 const s=S.songs.find(x=>x.ref===ref);if(!s)return alert('Música indisponível.');
 const ts=Date.now();commit(()=>S.requests.push({id:ts,pos:ts,ts,who:who(),nick:me.nick,ref,title:s.title,artist:s.artist,status:'queued'}));
 alert('Pedido enviado! 🎶');renderMine()}
function renderMine(){
 const mine=S.requests.filter(r=>r.who===who()).sort((a,b)=>b.ts-a.ts);
 $('#b').innerHTML=mine.length?mine.map(r=>{const q=S.requests.filter(x=>x.status==='queued'&&x.pos<r.pos).length+1;
  const info=r.status==='queued'?' · posição '+q:r.status==='done'?' · cantado às '+hm(r.finishedAt):'';
  return `<div class="song"><div><b>${esc(r.title)}</b>${esc(r.artist)}<br><small>#${esc(r.ref)} · pedido às ${hm(r.ts)}${info} · <a href="${yt(r.artist,r.title)}" target="_blank" rel="noopener" style="color:var(--pk)">▶ YouTube</a></small></div>${r.next?'<span class="tag" style="--c:#fbbf24">🔔 A SEGUIR</span>':`<span class="tag" style="--c:${ST[r.status][1]}">${ST[r.status][0]}</span>`}${r.status==='done'?`<button data-again="${esc(r.ref)}">🔁</button>`:''}</div>`}).join(''):'<p class="mut">Ainda não fizeste pedidos.</p>';
 $('#b').querySelectorAll('[data-again]').forEach(b=>b.onclick=()=>pedir(b.dataset.again))}
function renderMsgs(){$('#msgs').innerHTML=myMsgs().slice(-20).reverse().map(m=>`<div class="song"><div><b>${m.from==='op'?'Operador':'Eu'}</b>${esc(m.text)}<br><small>${hm(m.ts)}${m.to==='all'?' · para todos':''}</small></div></div>`).join('')||'<p class="mut">Sem mensagens.</p>'}
function renderOpts(){const i=S.info||{};
 $('#di').innerHTML=`<div class="song"><div><b>${esc(i.name||'Karaoke')}</b>${esc(i.contact||'')}<br><small>${esc(i.addr||'Sem informações adicionais.')}</small></div></div><button class="sec" id="tn">Trocar de nickname</button><button class="sec" id="lo">Sair</button>`;
 $('#tn').onclick=()=>screenId(me.phone);$('#lo').onclick=()=>{sessionStorage.clear();location.reload()}}

// ===== Avaliação do karaoke (NPS 0–10): 1 por nickname e sessão, editável até ao fim =====
let sel=null;
function renderEval(){const e=(S.evals||{})[who()];sel=e?e.score:null;
 $('#e').innerHTML=`<h4 style="margin:0 0 10px;font-weight:600">Qual a probabilidade de recomendares este karaoke a um amigo?</h4><div class="grid">${[...Array(11).keys()].map(i=>`<button data-s="${i}" class="${sel===i?'':'sec'}">${i}</button>`).join('')}</div>
 <p class="mut" style="display:flex;justify-content:space-between;margin:0 0 10px"><span>0 = nada provável</span><span>10 = muito provável</span></p>
 <textarea id="ec" rows="3" maxlength="500" placeholder="Comentário (opcional)">${esc(e?.comment||'')}</textarea><button id="es">${e?'Atualizar avaliação':'Enviar avaliação'}</button><p class="mut">${e?'Avaliaste com '+e.score+'. Podes editar até ao fim da sessão.':''}</p>`;
 $('#e').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sel=+b.dataset.s;$('#e').querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('sec',+x.dataset.s!==sel))});
 $('#es').onclick=()=>{if(sel===null)return alert('Escolhe uma nota de 0 a 10.');S=load();if(!S.session?.open)return alert('A sessão está encerrada.');
  commit(()=>{(S.evals??={})[who()]={nick:me.nick,score:sel,comment:$('#ec').value.trim(),ts:Date.now()}});alert('Obrigado pela tua avaliação! ⭐');renderEval()}}

// Atualização em tempo real (no Firebase será o onSnapshot) + alertas
addEventListener('storage',e=>{if(e.key!==K)return;S=load();if(!$('#res'))return;
 renderRes();renderMine();renderMsgs();renderOpts();
 const n=nextNow();if(n&&!wasNext)notify('🔔 É a seguir! Prepara-te para cantar.');wasNext=n;
 const c=myMsgs().filter(m=>m.from==='op').length;if(c>seenMsgs)notify('💬 Nova mensagem do operador');seenMsgs=c});
joined&&me&&S.session?.open?screenMain():joined?screenId():screenPin();
</script></body></html>
